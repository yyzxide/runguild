name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mission_control_test
          POSTGRES_USER: mission
          POSTGRES_PASSWORD: mission
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mission -d mission_control_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql://mission:mission@127.0.0.1:5432/mission_control_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install RunGuild system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Install exact dependencies
        run: npm ci

      - name: Build and run all tests
        run: npm test

      - name: Install Chromium for browser acceptance
        run: npx playwright install --with-deps chromium

      - name: Run browser acceptance
        run: npm run test:e2e
